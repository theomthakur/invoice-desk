services:
  - type: web
    name: invoice-desk
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/healthz
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: production
      - key: DATA_DIR
        value: /tmp/invoice-flow
      - key: STORAGE_PERSISTENCE
        value: ephemeral
      - key: LLM_PROVIDER
        value: openrouter
      - key: MODEL_MODE
        value: live
      - key: ALLOW_LIVE_IN_SESSIONS
        value: "1"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MODEL_BUDGET_USD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DEMO_ACCESS_CODE
        sync: false
