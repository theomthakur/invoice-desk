[project]
name = "invoice-flow"
version = "0.1.0"
description = "Multi-agent invoice processing prototype for the Acme Corp case"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "pdfplumber>=0.11",
    "defusedxml>=0.7.1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "langgraph>=1,<2",
    "python-multipart>=0.0.20",
    "itsdangerous>=2.2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "fpdf2>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_flow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests spend real money: deselected unless you pass `-m live` (and set the env vars).
addopts = "-ra -m 'not live'"
markers = ["live: calls a real model and spends money; needs RUN_LIVE_TESTS=1, a key and a cap"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are meant to be used as argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# the simulated reader's regexes and prompt text are long by nature
"src/invoice_flow/providers/simulated.py" = ["E501"]
"src/invoice_flow/agents/prompts.py" = ["E501"]
# exact-match source snippets cannot be wrapped
"scripts/mutation_check.py" = ["E501"]
